          </div></div>
        </div>

        <div class="obj" data-obj="note">
          <button class="obj-btn" type="button" aria-label="Sticky note. Edit this session's one task"></button>
          <div class="tag"><div class="tag-inner">
            <label class="tag-label" for="task-input">The one thing</label>
            <input class="tag-input" id="task-input" type="text" maxlength="40" autocomplete="off" spellcheck="true" placeholder="What is this session for?">
          </div></div>
        </div>

          </div></div>
        </div>

            <input class="slider" type="range" min="0" max="100" step="1" value="45" aria-label="Radio volume">

          <div class="tag"><div class="tag-inner">
            <span class="tag-label">Lamp <span class="tag-state">on</span></span>
          </div></div>
        </div>

        <div class="obj" data-obj="clock">
          <button class="obj-btn" type="button" aria-label="Desk clock. Focus, 25 minutes. Start" aria-describedby="status"></button>
          <div class="tag"><div class="tag-inner">
            <span class="tag-label"><span class="clock-phase">Focus, 1 of 4</span> <span class="tag-state">ready</span></span>
            <span class="tag-actions">
              <button class="text-btn" type="button" data-action="skip">Skip</button>

  <div class="popover" id="settings" role="dialog" aria-labelledby="settings-title" hidden>
    <h2 class="popover-title" id="settings-title">The clock</h2>
    <form class="settings-form" novalidate>
      <div class="field">
        <label for="set-focus">Focus</label>
        <span class="field-input"><input id="set-focus" name="focus" type="number" inputmode="numeric" min="1" max="120" step="1"> <span class="unit">min</span></span>
      </div>
      <div class="field">
        <label for="set-short">Short break</label>
        <span class="field-input"><input id="set-short" name="short" type="number" inputmode="numeric" min="1" max="30" step="1"> <span class="unit">min</span></span>
      </div>
      <div class="field">
        <label for="set-long">Long break</label>
        <span class="field-input"><input id="set-long" name="long" type="number" inputmode="numeric" min="1" max="60" step="1"> <span class="unit">min</span></span>
      </div>
      <div class="field">
        <label for="set-every">Long break after</label>
        <span class="field-input"><input id="set-every" name="longEvery" type="number" inputmode="numeric" min="2" max="8" step="1"> <span class="unit">sessions</span></span>
      </div>
      <label class="check">
        <input name="autoStart" type="checkbox">
        <span>Start the next session on its own</span>
      </label>
      <div class="popover-actions">
        <button class="text-btn" type="submit">Done</button>
      </div>
    </form>
  </div>

  <section class="drawer" id="drawer" data-open="false" aria-label="Sounds">
    <button class="drawer-handle" type="button" aria-expanded="false" aria-controls="drawer-body">
      <span>Sounds</span>
      <span class="drawer-handle-end"><span class="drawer-summary">all quiet</span><span class="drawer-chevron" aria-hidden="true"></span></span>
    </button>
    <div class="drawer-body" id="drawer-body">
      <div class="shelf-row" data-sound="rain">
        <button class="shelf-toggle" type="button" aria-pressed="false"><span class="pip" aria-hidden="true"></span>Rain</button>
        <input class="slider" type="range" min="0" max="100" step="1" value="60" aria-label="Rain volume">
      </div>
      <div class="shelf-row" data-sound="cafe">
        <button class="shelf-toggle" type="button" aria-pressed="false"><span class="pip" aria-hidden="true"></span>Café</button>
        <input class="slider" type="range" min="0" max="100" step="1" value="40" aria-label="Café volume">
      </div>
      <div class="shelf-row" data-sound="fire">
        <button class="shelf-toggle" type="button" aria-pressed="false"><span class="pip" aria-hidden="true"></span>Fire</button>
        <input class="slider" type="range" min="0" max="100" step="1" value="50" aria-label="Fire volume">
      </div>
      <div class="shelf-row" data-sound="radio">
        <button class="shelf-toggle" type="button" aria-pressed="false"><span class="pip" aria-hidden="true"></span>Radio</button>
        <input class="slider" type="range" min="0" max="100" step="1" value="45" aria-label="Radio volume">
      </div>
    </div>
  </section>

  <svg class="grain-layer" aria-hidden="true" focusable="false">
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect class="grain" width="100%" height="100%" filter="url(#grain)"/>
  </svg>
</body>
